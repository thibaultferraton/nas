<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NAS">
<title>NAS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Cpath d='M32 14v20' stroke='%233fb950' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M20 22a16 16 0 1 0 24 0' stroke='%233fb950' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#262d38; --line2:#333c48;
    --txt:#e6edf3; --dim:#8b949e;
    --on:#3fb950; --off:#6e7681; --wait:#d29922; --danger:#f85149;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:380px}
  h1{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 22px;text-align:center}

  /* ---------- etat ---------- */
  .status{
    position:relative;
    display:flex;align-items:center;gap:12px;justify-content:center;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 44px;margin-bottom:22px;
  }
  .refresh{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:0;color:#4b535e;cursor:pointer;
    padding:9px;line-height:0;border-radius:9px;
  }
  .refresh:hover{color:var(--dim)}
  .refresh.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--off);flex:none;transition:background .3s}
  .dot.on{background:var(--on);box-shadow:0 0 0 0 rgba(63,185,80,.5);animation:pulse 2.4s infinite}
  .dot.wait{background:var(--wait);animation:blink 1s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  @keyframes blink{50%{opacity:.25}}
  .status b{font-weight:600;font-size:16px}
  .status small{display:block;color:var(--dim);font-size:12.5px;font-weight:400;margin-top:1px}

  /* ---------- boutons ---------- */
  .btn{
    width:100%;border:1px solid var(--line2);border-radius:14px;
    background:var(--panel);color:var(--txt);
    font:600 17px/1 inherit;padding:20px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    cursor:pointer;transition:transform .08s,opacity .2s,border-color .2s;
  }
  .btn:active{transform:scale(.985)}
  .btn[disabled]{opacity:.32;cursor:default;transform:none}
  .btn.go{border-color:#1f6f34;background:#12291a;color:#7ee393}
  .btn.stop{border-color:#4a4331;background:#241f13;color:#e3c47e}
  .btn svg{flex:none}

  /* ---------- coupure forcee ---------- */
  .force{
    position:relative;overflow:hidden;margin-top:26px;
    border:1px solid #3d2224;background:#1b1315;color:#c96b68;
    border-radius:14px;padding:15px;font:500 14px/1 inherit;
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;cursor:pointer;user-select:none;
  }
  .force .fill{position:absolute;inset:0;background:var(--danger);opacity:.22;width:0;transition:width .05s linear}
  .force span{position:relative}

  .msg{min-height:20px;text-align:center;font-size:13.5px;color:var(--dim);margin-top:16px}
  .msg.err{color:var(--danger)}
  .msg.ok{color:var(--on)}

  .foot{display:flex;justify-content:center;margin-top:22px}
  .link{background:none;border:0;color:#4b535e;font:400 12.5px inherit;cursor:pointer;padding:6px 10px}
  .link:hover{color:var(--dim)}

  /* ---------- formulaires ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  label{display:block;font-size:12.5px;color:var(--dim);margin:0 0 6px}
  .hint{font-size:11.5px;color:#5e6672;margin:-10px 0 16px;line-height:1.45}
  input{
    width:100%;background:#0b0f14;border:1px solid var(--line2);border-radius:10px;
    color:var(--txt);font:15px ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:12px;margin-bottom:16px;
  }
  input:focus{outline:none;border-color:#4d7ec7}
  input.pin{font:600 22px/1 ui-monospace,monospace;text-align:center;letter-spacing:.5em;padding:16px 12px 16px 22px}
  .primary{width:100%;border:0;border-radius:10px;background:#2f6fd0;color:#fff;font:600 16px/1 inherit;padding:16px;cursor:pointer}
  .primary:active{transform:scale(.99)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ ECRAN 1 : configuration ============ -->
  <section id="setup" hidden>
    <h1>Configuration</h1>
    <div class="card">
      <label>Topic ntfy de l'ESP32 (allumage)</label>
      <input id="cfgPower" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="topic de l'ESP32">
      <label>Topic ntfy de l'agent PC (extinction / état)</label>
      <input id="cfgAgent" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="topic de l'agent">
      <label>Mot de passe des commandes</label>
      <input id="cfgSecret" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="mot de passe partage avec l agent">
      <label>Code de déverrouillage (facultatif)</label>
      <input id="cfgPin" class="pin" type="tel" inputmode="numeric" maxlength="8" placeholder="····">
      <p class="hint">Les topics ne sont enregistrés que dans ce navigateur, jamais dans la page. Avec un code, ils y sont chiffrés : quelqu'un qui tombe sur l'adresse ne peut rien faire.</p>
      <button class="primary" id="cfgSave">Enregistrer</button>
    </div>
    <div class="foot"><button class="link" id="cfgCancel" hidden>Annuler</button></div>
  </section>

  <!-- ============ ECRAN 2 : deverrouillage ============ -->
  <section id="lock" hidden>
    <h1>Verrouillé</h1>
    <div class="card">
      <label>Code</label>
      <input id="lockPin" class="pin" type="tel" inputmode="numeric" maxlength="8" placeholder="····" autofocus>
      <button class="primary" id="lockGo">Déverrouiller</button>
    </div>
    <div class="msg" id="lockMsg"></div>
    <div class="foot"><button class="link" id="lockReset">Reconfigurer</button></div>
  </section>

  <!-- ============ ECRAN 3 : commande ============ -->
  <section id="app" hidden>
    <h1>NAS</h1>

    <div class="status">
      <div class="dot" id="dot"></div>
      <div><b id="stTxt">Vérification…</b><small id="stSub">&nbsp;</small></div>
      <button class="refresh" id="bRefresh" title="Actualiser" aria-label="Actualiser">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>

    <button class="btn go" id="bOn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.5 7a8 8 0 1 0 11 0"/></svg>
      Allumer
    </button>

    <button class="btn stop" id="bOff">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.5 7a8 8 0 1 0 11 0"/></svg>
      Éteindre proprement
    </button>

    <button class="btn" id="bCancel" hidden>Annuler l'extinction</button>

    <button class="force" id="bForce">
      <div class="fill" id="forceFill"></div>
      <span>Coupure forcée — maintenir 2 s</span>
    </button>

    <div class="msg" id="msg">&nbsp;</div>
    <div class="foot"><button class="link" id="openCfg">Configuration</button></div>
  </section>

</div>

<script>
(() => {
  "use strict";
  const NTFY = "https://ntfy.sh";
  const KEY  = "nas.cfg";
  const $ = id => document.getElementById(id);

  let cfg = null;              // {power, agent} en memoire uniquement
  let poller = null;
  let optimistic = 0;          // horodatage d'un "allumer" recent

  // L agent ne publie plus qu un battement toutes les 10 min : le quota
  // gratuit de ntfy est de 250 messages par jour et par IP, et un battement
  // toutes les 30 s en consommait 2880. Attendre passivement rendrait donc
  // la page aveugle pendant des minutes. On demande l etat au lieu de
  // l attendre : la page publie "ping", l agent repond par un battement.
  const PING_COOLDOWN = 20000; // un ping toutes les 20 s au maximum
  const PING_WINDOW   = 10000; // delai de reponse accorde a l agent
  let lastPing  = 0;           // date du dernier ping reellement publie
  let pendingAt = 0;           // 0 = aucune interrogation en cours
  let baseReady = false;       // la reference d avant-ping est-elle relevee ?
  let baseHbId  = null;        // dernier battement connu juste avant le ping
  let deadHbId  = null;        // battement declare perime par un ping sans reponse
  let pingFailed = false;      // le dernier ping n a pas pu etre publie

  /* ---------------- chiffrement ---------------- */
  const b64  = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function keyFrom(pin, salt) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name:"PBKDF2", salt, iterations:200000, hash:"SHA-256" },
      base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  }
  async function seal(obj, pin) {
    if (!pin) return { v:1, enc:false, data: JSON.stringify(obj) };
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const k    = await keyFrom(pin, salt);
    const ct   = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(obj)));
    return { v:1, enc:true, salt:b64(salt), iv:b64(iv), data:b64(ct) };
  }
  async function open_(rec, pin) {
    if (!rec.enc) return JSON.parse(rec.data);
    const k  = await keyFrom(pin, ub64(rec.salt));
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:ub64(rec.iv) }, k, ub64(rec.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
  const save = r  => { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch {} };

  // A-t-on deja vu ce PC vivant ? Tant que non, la page ne peut pas savoir
  // s'il est allume, et "Allumer" pourrait en realite l'eteindre.
  const SEEN = "nas.seen";
  let everSeen = false;
  try { everSeen = localStorage.getItem(SEEN) === "1"; } catch {}
  function markSeen() { if (!everSeen) { everSeen = true; try { localStorage.setItem(SEEN, "1"); } catch {} } }

  /* ---------------- ecrans ---------------- */
  function show(which) {
    for (const s of ["setup","lock","app"]) $(s).hidden = (s !== which);
    if (which === "app") { startPolling(); requestState(false); } else stopPolling();
  }

  /* ---------------- reseau ---------------- */
  // Les commandes vers l agent portent un mot de passe partage. Sans lui,
  // l agent ignore le message : connaitre le nom du topic ne suffit plus.
  async function cmd(word) {
    if (!cfg.secret) { say("Configuration incomplète : ressaisis le mot de passe.", "err"); show("setup"); return; }
    return publish(cfg.agent, word + " " + cfg.secret);
  }

  async function publish(topic, text) {
    const r = await fetch(`${NTFY}/${encodeURIComponent(topic)}`, {
      method:"POST", body:text, headers:{ "Content-Type":"text/plain" }
    });
    if (!r.ok) throw new Error("ntfy " + r.status);
  }

  async function fetchState() {
    // 900 s : il faut pouvoir relire un battement de 10 min, sinon le filet
    // de securite ci-dessous ne verrait jamais rien.
    const r = await fetch(`${NTFY}/${encodeURIComponent(cfg.agent)}/json?poll=1&since=900s`, { cache:"no-store" });
    if (!r.ok) throw new Error("ntfy " + r.status);
    const txt = await r.text();
    let hb = null, ev = null;
    for (const line of txt.split("\n")) {
      if (!line.trim()) continue;
      let m; try { m = JSON.parse(line); } catch { continue; }
      if (m.event !== "message") continue;
      const body = (m.message || "").trim();
      if (body.startsWith("hb"))   hb = m;
      if (body.startsWith("etat")) ev = m;
    }
    return { hb, ev };
  }

  /* ---------------- interrogation a la demande ---------------- */
  // Publie "ping" et laisse PING_WINDOW a l agent pour repondre. Jamais plus
  // d un ping toutes les PING_COOLDOWN : chaque ping coute un message de
  // quota au telephone, et un autre au PC pour la reponse.
  function setBusy(b) { $("bRefresh").classList.toggle("spin", !!b); }

  async function requestState(manual) {
    if (!cfg || !cfg.secret) return;
    const now = Date.now();
    if (now - lastPing < PING_COOLDOWN) {
      if (manual) say(`Encore ${Math.ceil((PING_COOLDOWN - (now - lastPing)) / 1000)} s avant de pouvoir réinterroger`);
      tick();
      return;
    }
    lastPing  = now;
    pendingAt = now;
    baseReady = false;
    setBusy(true);
    paint("wait", "interrogation du PC…");
    try {
      // Releve d abord le dernier battement deja publie : c est lui qui sert
      // de reference pour reconnaitre la reponse. Sans ce releve, un vieux
      // battement encore visible passerait pour une reponse au ping.
      const before = await fetchState();
      baseHbId  = before.hb ? before.hb.id : null;
      baseReady = true;
      pendingAt = Date.now();   // la fenetre de reponse part du ping lui-meme
      await cmd("ping");
      pingFailed = false;
    } catch {
      // Publication refusee, quota du telephone atteint ou reseau coupe : la
      // page n a pas pu poser la question, elle ne sait donc rien.
      pendingAt  = 0;
      baseReady  = false;
      pingFailed = true;
      setBusy(false);
      paint("unknown", "envoi impossible");
      return;
    }
    // Relectures rapprochees pendant la fenetre de reponse : ce sont des
    // lectures, elles ne consomment pas le quota de publication.
    for (const d of [1500, 3500, 6000, 9000, PING_WINDOW + 800]) setTimeout(tick, d);
  }

  /* ---------------- affichage de l'etat ---------------- */
  function paint(state, sub) {
    const dot = $("dot");
    dot.className = "dot" + (state === "on" ? " on" : state === "wait" ? " wait" : "");
    const labels = { on:"En ligne", off:"Hors ligne", wait:"En cours…", unknown:"Injoignable" };
    $("stTxt").textContent = labels[state] || labels.unknown;
    $("stSub").textContent = sub || " ";
    // Allumer n'est actif que si l'on SAIT que le PC est eteint.
    $("bOn").disabled  = (state !== "off");
    $("bOff").disabled = (state !== "on");
  }

  async function tick() {
    try {
      const { hb, ev } = await fetchState();
      const now  = Date.now() / 1000;

      // Reponse a notre ping : un battement different de celui qui etait la
      // avant. On compare des identifiants et jamais deux horloges, celle du
      // telephone et celle de ntfy n etant pas les memes.
      const replied  = pendingAt !== 0 && baseReady && hb && hb.id !== baseHbId;
      const waiting  = pendingAt !== 0 && !replied &&
                       (!baseReady || (Date.now() - pendingAt) < PING_WINDOW);
      const timedOut = pendingAt !== 0 && !replied && !waiting;

      if (replied)  { pendingAt = 0; baseReady = false; deadHbId = null; pingFailed = false; }
      // Ping reste sans reponse : le PC est eteint, et le battement encore
      // visible est un vestige. On le marque pour que le filet ci-dessous ne
      // le reprenne pas pour un signe de vie au prochain tour.
      if (timedOut) { pendingAt = 0; baseReady = false; deadHbId = hb ? hb.id : null; }
      setBusy(pendingAt !== 0);

      // Filet de securite : l agent publie de lui-meme toutes les 10 min.
      const fresh = hb && hb.id !== deadHbId && (now - hb.time) < 750;
      const alive = replied || (!timedOut && fresh);
      const shuttingDown = ev && (now - ev.time) < 90 && /extinction en cours|redemarrage/.test(ev.message);

      if (waiting) { paint("wait", "interrogation du PC…"); return; }
      // Tant que la question n a pas pu partir, aucun verdict : se fier au
      // filet de 750 s ferait dire "en ligne" a partir d un battement qui
      // peut dater de dix minutes, et "hors ligne" sur un simple silence.
      if (pingFailed) { paint("unknown", "état inconnu — envoi impossible"); return; }
      if (shuttingDown && !alive) { paint("wait", "extinction en cours…"); return; }
      if (alive) {
        const mins = (hb.message.split(/\s+/)[2] | 0);
        const up = mins < 60 ? `${mins} min` : `${Math.floor(mins/60)} h ${mins%60} min`;
        paint("on", `allumé depuis ${up}`);
        optimistic = 0;
        markSeen();
        $("bCancel").hidden = !shuttingDown;
        return;
      }
      $("bCancel").hidden = true;
      if (Date.now() - optimistic < 150000) paint("wait", "démarrage en cours…");
      else paint("off", deadHbId ? "sans réponse au ping" : "aucun signe de vie");
    } catch (e) {
      paint("unknown", "ntfy injoignable");
    }
  }

  function startPolling() { tick(); clearInterval(poller); poller = setInterval(tick, 5000); }
  function stopPolling()  { clearInterval(poller); poller = null; }

  /* ---------------- messages ---------------- */
  let msgT;
  function say(text, kind) {
    const m = $("msg");
    m.textContent = text || " ";
    m.className = "msg" + (kind ? " " + kind : "");
    clearTimeout(msgT);
    if (text) msgT = setTimeout(() => { m.textContent = " "; m.className = "msg"; }, 4000);
  }

  /* ---------------- actions ---------------- */
  $("bOn").onclick = async () => {
    if (!everSeen && !confirm(
        "Ce PC n'a encore jamais signalé sa présence.\n\n" +
        "La page ne peut donc pas savoir s'il est allumé — et si c'est le cas, " +
        "cette impulsion l'ÉTEINDRA.\n\nEnvoyer quand même ?")) return;
    try { await publish(cfg.power, "allume123"); optimistic = Date.now(); say("Impulsion envoyée", "ok"); tick(); }
    catch { say("Envoi impossible — pas de réseau ?", "err"); }
  };

  $("bOff").onclick = async () => {
    try {
      await cmd("shutdown");
      say("Extinction demandée — 30 s pour annuler", "ok");
      $("bCancel").hidden = false;
      setTimeout(() => { $("bCancel").hidden = true; }, 32000);
      paint("wait", "extinction en cours…");
    } catch { say("Envoi impossible — pas de reseau ?", "err"); }
  };

  $("bRefresh").onclick = () => requestState(true);

  $("bCancel").onclick = async () => {
    try { await cmd("cancel"); say("Extinction annulée", "ok"); $("bCancel").hidden = true; tick(); }
    catch { say("Envoi impossible", "err"); }
  };

  // coupure forcee : appui long de 2 s
  (() => {
    const btn = $("bForce"), fill = $("forceFill");
    let raf = null, t0 = 0, done = false;
    const step = () => {
      const p = Math.min(1, (performance.now() - t0) / 2000);
      fill.style.width = (p * 100) + "%";
      if (p >= 1) { fire(); return; }
      raf = requestAnimationFrame(step);
    };
    const stop = () => { cancelAnimationFrame(raf); raf = null; fill.style.width = "0"; };
    async function fire() {
      if (done) return;
      done = true; stop();
      if (navigator.vibrate) navigator.vibrate(120);
      try { await publish(cfg.power, "force123"); say("Coupure forcée envoyée", "err"); }
      catch { say("Envoi impossible", "err"); }
    }
    btn.addEventListener("pointerdown", e => { e.preventDefault(); done = false; t0 = performance.now(); raf = requestAnimationFrame(step); });
    for (const ev of ["pointerup","pointerleave","pointercancel"]) btn.addEventListener(ev, stop);
    btn.addEventListener("contextmenu", e => e.preventDefault());
  })();

  /* ---------------- configuration ---------------- */
  $("openCfg").onclick = () => {
    $("cfgPower").value = cfg ? cfg.power : "";
    $("cfgAgent").value = cfg ? cfg.agent : "";
    $("cfgPin").value = "";
    $("cfgCancel").hidden = !cfg;
    show("setup");
  };
  $("cfgCancel").onclick = () => show("app");

  $("cfgSave").onclick = async () => {
    const power = $("cfgPower").value.trim();
    const agent = $("cfgAgent").value.trim();
    const pin   = $("cfgPin").value.trim();
    const secret = $("cfgSecret").value.trim();
    if (!power || !agent || !secret) { alert("Les deux topics et le mot de passe sont nécessaires."); return; }
    cfg = { power, agent, secret };
    save(await seal(cfg, pin));
    show("app");
  };

  $("lockGo").onclick = async () => {
    try {
      cfg = await open_(load(), $("lockPin").value.trim());
      $("lockMsg").textContent = "";
      show("app");
    } catch {
      $("lockMsg").textContent = "Code incorrect";
      $("lockMsg").className = "msg err";
      $("lockPin").value = "";
    }
  };
  $("lockPin").addEventListener("keydown", e => { if (e.key === "Enter") $("lockGo").click(); });
  $("lockReset").onclick = () => {
    if (confirm("Effacer la configuration enregistrée ?")) { localStorage.removeItem(KEY); location.reload(); }
  };

  /* ---------------- demarrage ---------------- */
  const rec = load();
  if (!rec)          { $("cfgCancel").hidden = true; show("setup"); }
  else if (rec.enc)  { show("lock"); setTimeout(() => $("lockPin").focus(), 100); }
  else               { cfg = JSON.parse(rec.data); show("app"); }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !$("app").hidden) { startPolling(); requestState(false); }
    else if (document.visibilityState === "hidden") stopPolling();
  });
})();
</script>
</body>
</html>
